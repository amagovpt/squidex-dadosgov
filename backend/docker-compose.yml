name: squidex-dadosgov

services:
  squidex-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: squidex-dadosgov-backend:latest
    env_file:
      - .env
    ports:
      - '3333:3333'
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - default

networks:
  default:
    driver: bridge
